{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon"><i class="fa-solid fa-recycle"></i></div>
    <h2>Welcome back</h2>
    <p class="text-muted">Sign in to your GreenCity account.</p>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input class="form-control" type="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
      </div>
      <button class="btn btn-success w-100" type="submit">Sign in</button>
    </form>

    <p class="mt-3 mb-0 text-center">New citizen? <a href="{{ url_for('register') }}">Create an account</a></p>

    <div class="login-admin-credentials" aria-label="Demo administrator login credentials">
      <div class="login-admin-heading"><i class="fa-solid fa-shield-halved"></i> Admin Login Credentials</div>
      <div class="login-admin-row">
        <span>Email</span>
        <strong>admin@smartwaste.local</strong>
      </div>
      <div class="login-admin-row">
        <span>Password</span>
        <strong>Admin@123</strong>
      </div>
      <p>Demo access for project evaluation only.</p>
    </div>
  </div>
</div>
{% endblock %}
