{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card wide"><div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div><h2>Create citizen account</h2><p class="text-muted">Join your community's cleaner-city initiative.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="col-md-6 mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-md-6 mb-3"><label class="form-label">Password (min. 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-12 mb-3"><label class="form-label">Address</label><input class="form-control" name="address"></div></div><button class="btn btn-success w-100">Create account</button></form><p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
