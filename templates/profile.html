{% extends "base.html" %}{% block title %}My Profile{% endblock %}
{% block content %}<div class="page-heading"><div><span class="eyebrow">ACCOUNT</span><h1>My profile</h1><p>Keep your contact information up to date.</p></div></div><div class="section-card profile-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required><label class="form-label">Email (cannot be changed here)</label><input class="form-control mb-3" value="{{ current_user.email }}" disabled><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ current_user.phone or '' }}"><label class="form-label">Address</label><input class="form-control mb-3" name="address" value="{{ current_user.address or '' }}"><button class="btn btn-success">Save profile</button></form></div>{% endblock %}
